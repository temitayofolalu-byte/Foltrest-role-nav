<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reviews — Foltrest</title><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar" id="topbar"></div><div class="wrap page-pad"><div class="page-header"><svg viewBox="0 0 40 40" width="24" height="24"><polygon points="20,4 24,15 36,15 26,22 30,34 20,26 10,34 14,22 4,15 16,15" fill="#f1691f"/><circle cx="20" cy="19" r="4" fill="#fff"/><path d="M18 19l1.3 1.3 2.7-2.7" stroke="#1f7a46" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg><h2 style="font-size:1.3rem;">Foltrest Reviews</h2></div><div id="summary"></div><div id="reviews"></div></div><script src="config.js"></script><script src="js/common.js"></script><script>renderNav('reviews');async function load(){const r=await fetch(`${API}/trust/site-reviews`);const d=await r.json();document.getElementById('summary').innerHTML=`<div class="stat-row"><div class="stat-card"><div class="num">${d.average?d.average.toFixed(1):'—'} ★</div><div class="lbl">Average rating</div></div><div class="stat-card"><div class="num">${d.count}</div><div class="lbl">Reviews</div></div></div>`;document.getElementById('reviews').innerHTML=d.reviews.map(x=>`<div class="card" style="padding:18px;margin-bottom:12px;"><strong>${'★'.repeat(Number(x.rating))}${'☆'.repeat(5-Number(x.rating))}</strong><p style="margin:8px 0;">${x.comment||'No comment.'}</p><small style="color:var(--grey);">${new Date(x.createdAt).toLocaleDateString()}</small></div>`).join('')||'<div class="empty-state">No site reviews yet.</div>';}load();</script></body></html>
