<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications — Foltrest</title><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar" id="topbar"></div><div class="wrap page-pad"><div class="page-header"><svg viewBox="0 0 40 40" width="24" height="24"><path d="M20 6a8 8 0 0 0-8 8v6l-3 5h22l-3-5v-6a8 8 0 0 0-8-8Z" fill="#f1691f"/><circle cx="20" cy="32" r="3" fill="#12210f"/></svg><h2 style="font-size:1.3rem">Notifications</h2></div><div id="box"></div></div><script src="config.js"></script><script src="js/common.js"></script><script>renderNav('');async function load(){if(!requireLogin())return;const r=await fetch(`${API}/notifications`,{headers:authHeaders()});const a=await r.json();document.getElementById('box').innerHTML=a.map(n=>`<div class="card" style="padding:16px;margin-bottom:10px;${n.read?'opacity:.65':''}"><strong>${n.title}</strong><p>${n.body}</p><small>${new Date(n.createdAt).toLocaleString()}</small>${!n.read?`<button class="btn-ghost btn-sm" onclick="read('${n.id}')">Mark read</button>`:''}</div>`).join('')||'<div class="empty-state">No notifications.</div>';}async function read(id){await fetch(`${API}/notifications/${id}/read`,{method:'POST',headers:authHeaders()});load()}load();</script></body></html>
