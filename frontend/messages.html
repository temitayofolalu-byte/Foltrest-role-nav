<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages — Foltrest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="wrap page-pad">
  <div class="page-header"><svg viewBox="0 0 40 40" width="24" height="24"><path d="M6 12h24a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H17l-6 5v-5H6a3 3 0 0 1-3-3V15a3 3 0 0 1 3-3Z" fill="#1f7a46"/><path d="M13 19l4.5-4 4.5 4v6h-3v-3h-2.5v3H13z" fill="#fff"/></svg><strong style="font-family:'Sora'; font-size:1.2rem;">Messages</strong></div>
  <div id="chatsContent"></div>
</div>

<script src="config.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('messages');

async function loadChats(){
  const el = document.getElementById('chatsContent');
  if (!state.user){ el.innerHTML = `<div class="empty-state">Log in to see your messages.</div>`; return; }
  const res = await fetch(`${API}/messages`, { headers: authHeaders() });
  const convos = await res.json();
  el.innerHTML = convos.length ? convos.map(c => `
    <a class="chat-list-item" href="thread.html?listingId=${c.listingId||''}&otherId=${c.otherUserId}&otherName=${encodeURIComponent(c.otherUserName||'User')}">
      <div class="chat-avatar">${(c.otherUserName||'?').slice(0,2)}</div>
      <div style="flex:1; min-width:0;">
        <h5 style="font-size:0.9rem; font-family:'Sora';">${c.otherUserName || 'User'} ${c.listingTitle ? '· ' + c.listingTitle : ''}</h5>
        <p style="font-size:0.8rem; color:var(--grey); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${c.lastMessage}</p>
      </div>
    </a>`).join('') : `<div class="empty-state">No conversations yet — message an agent from a listing page, or an agent can message admin from their dashboard.</div>`;
}
loadChats();
</script>
</body>
</html>
