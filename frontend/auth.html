<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — Foltrest</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar" id="topbar"></div>

<div class="wrap page-pad" style="max-width:460px;">
  <div class="page-header"><svg viewBox="0 0 40 40" width="24" height="24"><rect x="9" y="18" width="22" height="15" rx="3" fill="#fff" stroke="#1f7a46" stroke-width="1.6"/><path d="M13 18v-4a7 7 0 0 1 14 0v4" stroke="#1f7a46" stroke-width="2.2" fill="none"/><circle cx="20" cy="25" r="2.6" fill="#f1691f"/></svg><strong id="authTitle" style="font-family:'Sora'; font-size:1.2rem;">Log in</strong></div>

  <div id="authError"></div><div id="resetBox" style="display:none"><div class="form-field"><label>New password</label><input id="resetPassword" type="password"></div><button class="btn btn-dark btn-block" onclick="finishReset()">Set new password</button></div>
  <div class="form-field" id="nameField"><label>Full name</label><input id="authName" type="text"></div>
  <div class="form-field"><label>Email</label><input id="authEmail" type="email"></div>
  <div class="form-field" id="phoneField"><label>Phone</label><input id="authPhone" type="text" placeholder="234..."></div>
  <div class="form-field"><label>Password</label><input id="authPassword" type="password"></div>
  <div class="form-field" id="roleField">
    <label>I am a</label>
    <select id="authRole" onchange="toggleAgentDocFields()"><option value="renter">Renter</option><option value="agent">Agent</option></select>
  </div>
  <div id="agentDocFields" style="display:none;">
    <div class="form-field">
      <label>Valid ID document</label>
      <input id="authIdDoc" type="file" accept="image/*,.pdf" onchange="uploadDoc(this, 'idDoc')">
      <div id="idDocStatus" class="form-hint"></div>
    </div>
    <div class="form-field">
      <label>Passport photograph</label>
      <input id="authPassportPhoto" type="file" accept="image/*" onchange="uploadDoc(this, 'passportPhoto')">
      <div id="passportPhotoStatus" class="form-hint"></div>
    </div>
    <p class="form-hint" style="margin-bottom:14px;">Admin reviews these before you can post listings. This confirms you're a real, accountable agent.</p>
  </div>
  <button class="btn btn-dark btn-block" id="authSubmitBtn" onclick="submitAuth()">Log in</button>
  <p id="forgotWrap" style="margin-top:12px;text-align:center;"><a href="#" onclick="forgotPassword();return false;" style="color:var(--orange);font-weight:700;">Forgot password?</a></p>
  <p style="margin-top:16px; font-size:0.85rem; text-align:center;">
    <a href="#" onclick="toggleAuthMode(); return false;" id="authToggleLink" style="color:var(--orange); font-weight:700;">Need an account? Register</a>
  </p>

</div>

<script src="config.js"></script>
<script src="js/common.js"></script>
<script>
renderNav('');
const resetToken=new URLSearchParams(location.search).get('reset');
if(resetToken){document.getElementById('resetBox').style.display='block';document.querySelectorAll('#nameField,#phoneField,#roleField,#agentDocFields,#authSubmitBtn,#forgotWrap,#authToggleLink').forEach(x=>x.style.display='none');document.getElementById('authTitle').textContent='Reset your password';}
async function finishReset(){const p=document.getElementById('resetPassword').value;const r=await fetch(`${API}/auth/reset-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:resetToken,password:p})});const d=await r.json();document.getElementById('authError').innerHTML=`<div class="${r.ok?'success-msg':'error-msg'}">${d.message||'Done'}</div>`;if(r.ok)setTimeout(()=>location.href='auth.html',1200);}

const verifyToken=new URLSearchParams(location.search).get('verify');
if(verifyToken){
  document.querySelectorAll('#nameField,#phoneField,#roleField,#agentDocFields,#authSubmitBtn,#forgotWrap,#authToggleLink,#resetBox').forEach(x=>x.style.display='none');
  document.getElementById('authTitle').textContent='Verifying your email…';
  fetch(`${API}/auth/verify-email`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:verifyToken})})
    .then(r=>r.json().then(d=>({ok:r.ok,d})))
    .then(({ok,d})=>{
      document.getElementById('authError').innerHTML=`<div class="${ok?'success-msg':'error-msg'}">${d.message||'Done'}</div>`;
      document.getElementById('authTitle').textContent=ok?'Email verified!':'Verification failed';
      if(ok)setTimeout(()=>location.href='auth.html',1500);
    });
}

let authMode = 'login';
let uploadedUrls = { idDoc: null, passportPhoto: null };

function applyAuthModeUI(){
  document.getElementById('authTitle').textContent = authMode === 'login' ? 'Log in' : 'Create your account';
  document.getElementById('authSubmitBtn').textContent = authMode === 'login' ? 'Log in' : 'Register';
  document.getElementById('authToggleLink').textContent = authMode === 'login' ? 'Need an account? Register' : 'Already have an account? Log in';
  document.getElementById('nameField').style.display = authMode === 'login' ? 'none' : 'block';
  document.getElementById('phoneField').style.display = authMode === 'login' ? 'none' : 'block';
  document.getElementById('roleField').style.display = authMode === 'login' ? 'none' : 'block';
  document.getElementById('agentDocFields').style.display = 'none';
  document.getElementById('forgotWrap').style.display = authMode === 'login' ? 'block' : 'none';
  document.getElementById('authError').innerHTML = '';
}
applyAuthModeUI();
if(resetToken){ document.getElementById('resetBox').style.display='block'; document.querySelectorAll('#nameField,#phoneField,#roleField,#agentDocFields,#authSubmitBtn,#forgotWrap,#authToggleLink').forEach(x=>x.style.display='none'); }

// Deep-link support: auth.html?mode=register&role=agent pre-selects Register + Agent,
// used by the "Become an agent" pitch page's apply button.
if(!resetToken && !verifyToken){
  const qp = new URLSearchParams(location.search);
  if(qp.get('mode') === 'register'){
    authMode = 'register';
    applyAuthModeUI();
  }
  if(qp.get('role') === 'agent'){
    document.getElementById('authRole').value = 'agent';
    toggleAgentDocFields();
  }
}

function toggleAgentDocFields(){
  document.getElementById('agentDocFields').style.display = document.getElementById('authRole').value === 'agent' ? 'block' : 'none';
}
function toggleAuthMode(){
  authMode = authMode === 'login' ? 'register' : 'login';
  applyAuthModeUI();
}

async function uploadDoc(input, key){
  const file = input.files[0];
  if (!file) return;
  const statusEl = document.getElementById(key + 'Status');
  statusEl.textContent = 'Uploading…';
  statusEl.style.color = 'var(--grey)';
  const formData = new FormData();
  formData.append('file', file);
  try {
    const res = await fetch(`${API}/uploads/document`, { method: 'POST', body: formData });
    const data = await res.json();
    if (!res.ok){ statusEl.textContent = data.message || 'Upload failed'; statusEl.style.color = 'var(--red-dark)'; return; }
    uploadedUrls[key] = data.url;
    statusEl.textContent = '✓ Uploaded: ' + data.originalName;
    statusEl.style.color = 'var(--green-dark)';
  } catch(e){
    statusEl.textContent = 'Upload failed — is the backend running?';
    statusEl.style.color = 'var(--red-dark)';
  }
}

async function forgotPassword(){const email=document.getElementById('authEmail').value.trim();if(!email){document.getElementById('authError').innerHTML='<div class="error-msg">Enter your email first.</div>';return;}const r=await fetch(`${API}/auth/forgot-password`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})});const d=await r.json();document.getElementById('authError').innerHTML=`<div class="success-msg">${d.message||'Check your email for a reset link.'}</div>`;}

async function submitAuth(){
  const email = document.getElementById('authEmail').value.trim();
  const password = document.getElementById('authPassword').value;
  const errBox = document.getElementById('authError');
  errBox.innerHTML = '';
  try {
    let res, data;
    if (authMode === 'login'){
      res = await fetch(`${API}/auth/login`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ email, password }) });
    } else {
      const name = document.getElementById('authName').value.trim();
      const phone = document.getElementById('authPhone').value.trim();
      const role = document.getElementById('authRole').value;
      if (role === 'agent' && (!uploadedUrls.idDoc || !uploadedUrls.passportPhoto)){
        errBox.innerHTML = `<div class="error-msg">Please upload both your ID document and passport photograph before registering.</div>`;
        return;
      }
      res = await fetch(`${API}/auth/register`, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name, email, phone, password, role, idDocumentUrl: uploadedUrls.idDoc, passportPhotoUrl: uploadedUrls.passportPhoto }) });
    }
    data = await res.json();
    if (!res.ok) { errBox.innerHTML = `<div class="error-msg">${data.message}</div>`; return; }
    localStorage.setItem('foltrest_token', data.token);
    localStorage.setItem('foltrest_user', JSON.stringify(data.user));
    window.location.href = 'browse.html';
  } catch(e){ errBox.innerHTML = `<div class="error-msg">Something went wrong. Is the backend running?</div>`; }
}
</script>
</body>
</html>
